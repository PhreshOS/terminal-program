    <path d="M60 84h30" stroke="#8fdc8f" stroke-width="6" stroke-linecap="round"/>
    <path d="M75 84V70" stroke="#3f9c50" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 72c-2-8-8-11-14-9 1 7 7 11 14 9z" fill="url(#green)"/>
    <path d="M75 69c2-9 10-12 16-9-1 8-9 12-16 9z" fill="url(#green-light)"/>
</svg>
