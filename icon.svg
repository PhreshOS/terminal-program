<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
    <!-- Terminal: an apricot screen, and on its dark soil a prompt whose cursor is a sprout. -->
    <defs>
        <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd48a"/><stop offset=".6" stop-color="#f9b25c"/><stop offset="1" stop-color="#ec8d3c"/></linearGradient>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3622"/><stop offset="1" stop-color="#3b2216"/></linearGradient>
        <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fdc8f"/><stop offset="1" stop-color="#2f8f45"/></linearGradient>
        <linearGradient id="green-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdeca8"/><stop offset="1" stop-color="#58b566"/></linearGradient>
    </defs>
    <rect x="12" y="20" width="104" height="88" rx="18" fill="url(#frame)"/>
    <path d="M24 29h56" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <rect x="21" y="36" width="86" height="63" rx="11" fill="url(#soil)"/>
